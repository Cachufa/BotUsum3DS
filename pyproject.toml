[project]
name = "botusum"
version = "0.1.0"
description = "Shiny hunt bot for Pokémon Ultra Sun / Ultra Moon via Azahar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pynput>=1.7.6"]

[project.scripts]
botusum = "botusum.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botusum"]
